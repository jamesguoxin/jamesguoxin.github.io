- title: Gene & RNA Foundation Models
  description: Learning biological representations with gene and RNA foundation models, and developing sequence-based siRNA design and structure-based RNA design methods.
- title: AI Scientists
  description: Reasoning, tool use, and learning over long-horizon tasks to support scientific discovery and experimental decision-making.
- title: Autonomous Labs
  description: Connecting molecular design with experiment planning, execution, and measurement in feedback loops that guide the next round of discovery.
- title: Programmable Therapeutics
  description: A long-term vision of using disease mechanisms to guide target selection and RNA design toward programmable and personalized nucleic acid therapies.
