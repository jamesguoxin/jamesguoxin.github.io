 y="548" fill="#183448" font-size="26" font-weight="700" text-anchor="start"><tspan x="530" dy="0">Persistent cell state</tspan><tspan x="530" dy="33.800000000000004">Intervention simulation</tspan></text><path d="M530,611 L870,611" fill="none" stroke="#d7e2e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="653" fill="#146fa3" font-size="23" font-weight="700" text-anchor="start"><tspan x="530" dy="0">REPORTED EVIDENCE</tspan></text><text x="530" y="698" fill="#183448" font-size="25" font-weight="400" text-anchor="start"><tspan x="530" dy="0">Component and selected</tspan><tspan x="530" dy="32.5">integrated evaluations</tspan></text><text x="530" y="834" fill="#b95d43" font-size="23" font-weight="700" text-anchor="start"><tspan x="530" dy="0">INTERPRETATION LIMIT</tspan></text><text x="530" y="879" fill="#506677" font-size="25" font-weight="400" text-anchor="start"><tspan x="530" dy="0">Broader reliability across</tspan><tspan x="530" dy="32.5">biological contexts</tspan><tspan x="530" dy="32.5">remains unresolved</tspan></text><rect x="940" y="173" width="400" height="805" rx="22" fill="white" stroke="#d7e2e8" stroke-width="2"/><text x="970" y="228" fill="#183448" font-size="32" font-weight="700" text-anchor="start"><tspan x="970" dy="0">AIDO.Builder</tspan></text><text x="970" y="271" fill="#506677" font-size="23" font-weight="400" text-anchor="start"><tspan x="970" dy="0">Guo et al. (2026)</tspan></text><text x="970" y="305" fill="#506677" font-size="23" font-weight="400" text-anchor="start"><tspan x="970" dy="0">bioRxiv preprint</tspan></text><g transform="translate(1140 390) scale(1.04)"><rect x="-73" y="-49" width="146" height="98" rx="12" fill="#eef5f7" stroke="#146fa3" stroke-width="2"/><path d="M-73,-23 L73,-23" fill="none" stroke="#146fa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-55" cy="-36" r="3" fill="#087f8c" stroke="none" stroke-width="2"/><circle cx="-43" cy="-36" r="3" fill="#087f8c" stroke="none" stroke-width="2"/><circle cx="-31" cy="-36" r="3" fill="#087f8c" stroke="none" stroke-width="2"/><path d="M-28,-3 L-45,10 L-28,23 M28,-3 L45,10 L28,23 M9,-7 L-9,29" fill="none" stroke="#087f8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="970" y="503" fill="#087f8c" font-size="23" font-weight="700" text-anchor="start"><tspan x="970" dy="0">FOCUS</tspan></text><text x="970" y="548" fill="#183448" font-size="26" font-weight="700" text-anchor="start"><tspan x="970" dy="0">Automated computational</tspan><tspan x="970" dy="33.800000000000004">modeling workflows</tspan></text><path d="M970,611 L1310,611" fill="none" stroke="#d7e2e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="970" y="653" fill="#146fa3" font-size="23" font-weight="700" text-anchor="start"><tspan x="970" dy="0">REPORTED EVIDENCE</tspan></text><text x="970" y="698" fill="#183448" font-size="25" font-weight="400" text-anchor="start"><tspan x="970" dy="0">Task benchmarks;</tspan><tspan x="970" dy="32.5">documented errors in</tspan><tspan x="970" dy="32.5">spatial patterns</tspan></text><text x="970" y="834" fill="#b95d43" font-size="23" font-weight="700" text-anchor="start"><tspan x="970" dy="0">INTERPRETATION LIMIT</tspan></text><text x="970" y="879" fill="#506677" font-size="25" font-weight="400" text-anchor="start"><tspan x="970" dy="0">Task scores do not establish</tspan><tspan x="970" dy="32.5">biological explanations</tspan></text><rect x="60" y="1021" width="1280" height="142" rx="22" fill="#e8f2f3" stroke="#bad5da" stroke-width="2"/><text x="90" y="1068" fill="#087f8c" font-size="24" font-weight="700" text-anchor="start"><tspan x="90" dy="0">A SHARED OPEN QUESTION</tspan></text><text x="90" y="1118" fill="#183448" font-size="28" font-weight="700" text-anchor="start"><tspan x="90" dy="0">How far do the findings extend beyond the settings in which they were evaluated?</tspan></text><text x="60" y="1218" fill="#506677" font-size="24" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Qualitative summary of 2026 papers and report; no performance ranking.</tspan></text></g></svg>