<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1260" viewBox="0 0 1400 1260" role="img" aria-labelledby="title desc">
<title id="title">Three systems, three kinds of evidence</title><desc id="desc">Qualitative comparison of three 2026 systems. VirTues reports spatial tissue representations and missing-marker reconstruction in measured tissue states; intervention dynamics are not established. AIDO Cell V1 reports persistent cell state and intervention simulation, with component and selected integrated evaluations; broader reliability across biological contexts remains unresolved. AIDO.Builder automates computational modeling workflows, with task benchmarks and documented spatial-pattern errors; task scores do not establish biological explanations. This is not a quantitative performance comparison.</desc>
