fa3" stroke-width="2"/><circle cx="42" cy="-1" r="5" fill="#b95d43" stroke="none" stroke-width="2"/><path d="M-60,24 L-42,15 L-24,24 L-24,45 L-42,54 L-60,45 Z" fill="#eaf0f8" stroke="#146fa3" stroke-width="2"/><circle cx="-42" cy="34" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><path d="M-22,24 L-4,15 L14,24 L14,45 L-4,54 L-22,45 Z" fill="#e7f2f1" stroke="#146fa3" stroke-width="2"/><circle cx="-4" cy="34" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><path d="M16,24 L34,15 L52,24 L52,45 L34,54 L16,45 Z" fill="#eaf0f8" stroke="#146fa3" stroke-width="2"/><circle cx="34" cy="34" r="5" fill="#087f8c" stroke="none" stroke-width="2"/></g><text x="90" y="503" fill="#087f8c" font-size="23" font-weight="700" text-anchor="start"><tspan x="90" dy="0">FOCUS</tspan></text><text x="90" y="548" fill="#183448" font-size="26" font-weight="700" text-anchor="start"><tspan x="90" dy="0">Spatial tissue</tspan><tspan x="90" dy="33.800000000000004">representations</tspan></text><path d="M90,611 L430,611" fill="none" stroke="#d7e2e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="653" fill="#146fa3" font-size="23" font-weight="700" text-anchor="start"><tspan x="90" dy="0">REPORTED EVIDENCE</tspan></text><text x="90" y="698" fill="#183448" font-size="25" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Missing-marker</tspan><tspan x="90" dy="32.5">reconstruction in</tspan><tspan x="90" dy="32.5">measured tissue states</tspan></text><text x="90" y="834" fill="#b95d43" font-size="23" font-weight="700" text-anchor="start"><tspan x="90" dy="0">INTERPRETATION LIMIT</tspan></text><text x="90" y="879" fill="#506677" font-size="25" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Evidence for intervention</tspan><tspan x="90" dy="32.5">dynamics is not established</tspan></text><rect x="500" y="173" width="400" height="805" rx="22" fill="white" stroke="#d7e2e8" stroke-width="2"/><text x="530" y="228" fill="#183448" font-size="32" 