<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1754" viewBox="0 0 640 1754" role="img" aria-labelledby="title desc">
<title id="title">Organization and dynamics across biological scales</title><desc id="desc">The same six components form separated or coupled groups. Molecular interactions, cellular state and tissue organization exchange influences and feedback. Conceptual example without measured data.</desc>
<defs><marker id="arrow-183448" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#183448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-087f8c" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#087f8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-146fa3" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#146fa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-b95d43" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#b95d43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-506677" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#506677" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="640" height="1754" rx="24" fill="#fafaf6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="60" fill="#183448" font-size="34" font-weight="700" text-anchor="start"><tspan x="32" dy="0">Organization changes</tspan><tspan x="32" dy="44.2">what a system can do</tspan></text><text x="32" y="162" fill="#506677" font-size="26" font-weight="400" text-anchor="start"><tspan x="32" dy="0">Same parts and counts.</tspan><tspan x="32" dy="33.800000000000004">Different patterns of interaction.</tspan></text><rect x="32" y="240" width="576" height="286" rx="22" fill="white" stroke="#d7e2e8" stroke-width="2"/><text x="60" y="283" fill="#183448" font-size="28" font-weight="700" text-anchor="start"><tspan x="60" dy="0">Separated groups</tspan></text><g transform="translate(320 359) scale(1.05)"><path d="M-106,-37 L-146,38" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-146,38 L-65,38" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-65,38 L-106,-37" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M106,-37 L65,38" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M65,38 L146,38" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M146,38 L106,-37" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-106" cy="-37" r="14" fill="#e4f0f1" stroke="#087f8c" stroke-width="3"/><path d="M-146,22 L-130,38 L-146,54 L-162,38 Z" fill="#fff0e8" stroke="#b95d43" stroke-width="3"/><circle cx="-65" cy="38" r="14" fill="#e4f0f1" stroke="#087f8c" stroke-width="3"/><path d="M106,-53 L122,-37 L106,-21 L90,-37 Z" fill="#fff0e8" stroke="#b95d43" stroke-width="3"/><circle cx="65" cy="38" r="14" fill="#e4f0f1" stroke="#087f8c" stroke-width="3"/><path d="M146,22 L162,38 L146,54 L130,38 Z" fill="#fff0e8" stroke="#b95d43" stroke-width="3"/></g><path d="M320,410 L320,438" fill="none" stroke="#146fa3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-146fa3)"/><text x="320" y="471" fill="#146fa3" font-size="25" font-weight="400" text-anchor="middle"><tspan x="320" dy="0">Local responses can remain separate</tspan></text><rect x="32" y="561" width="576" height="286" rx="22" fill="white" stroke="#d7e2e8" stroke-width="2"/><text x="60" y="604" fill="#183448" font-size="28" font-weight="700" text-anchor="start"><tspan x="60" dy="0">Coupled groups</tspan></text><g transform="translate(320 680) scale(1.05)"><path d="M-106,-37 L-146,38" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-146,38 L-65,38" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-65,38 L-106,-37" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M106,-37 L65,38" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M65,38 L146,38" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M146,38 L106,-37" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-106,-37 L106,-37" fill="none" stroke="#b95d43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-65,38 L65,38" fill="none" stroke="#b95d43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-106" cy="-37" r="14" fill="#e4f0f1" stroke="#087f8c" stroke-width="3"/><path d="M-146,22 L-130,38 L-146,54 L-162,38 Z" fill="#fff0e8" stroke="#b95d43" stroke-width="3"/><circle cx="-65" cy="38" r="14" fill="#e4f0f1" stroke="#087f8c" stroke-width="3"/><path d="M106,-53 L122,-37 L106,-21 L90,-37 Z" fill="#fff0e8" stroke="#b95d43" stroke-width="3"/><circle cx="65" cy="38" r="14" fill="#e4f0f1" stroke="#087f8c" stroke-width="3"/><path d="M146,22 L162,38 L146,54 L130,38 Z" fill="#fff0e8" stroke="#b95d43" stroke-width="3"/></g><path d="M320,731 L320,759" fill="none" stroke="#146fa3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-146fa3)"/><text x="320" y="792" fill="#146fa3" font-size="25" font-weight="400" text-anchor="middle"><tspan x="320" dy="0">Responses can pass between groups</tspan></text><circle cx="48" cy="889" r="11" fill="#e4f0f1" stroke="#087f8c" stroke-width="3"/><path d="M85,876 L98,889 L85,902 L72,889 Z" fill="#fff0e8" stroke="#b95d43" stroke-width="3"/><text x="112" y="898" fill="#506677" font-size="25" font-weight="400" text-anchor="start"><tspan x="112" dy="0">3 of each type; connections change</tspan></text><text x="32" y="944" fill="#506677" font-size="25" font-weight="400" text-anchor="start"><tspan x="32" dy="0">Dynamics also depend on interaction</tspan><tspan x="32" dy="32.5">strengths, timing, and context.</tspan></text><rect x="32" y="1036" width="576" height="628" rx="22" fill="white" stroke="#d7e2e8" stroke-width="2"/><text x="60" y="1081" fill="#087f8c" font-size="25" font-weight="700" text-anchor="start"><tspan x="60" dy="0">LEARN THE RELATIONS</tspan><tspan x="60" dy="32.5">BETWEEN SCALES</tspan></text><g transform="translate(115 1210) scale(0.82)"><path d="M-55,19 L-37,2 L-18,15 L0,-3 L2,-27 L21,-43 L43,-30 L44,-8 L24,9 L32,31 L53,41" fill="none" stroke="#087f8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-55" cy="19" r="5" fill="#b95d43" stroke="none" stroke-width="2"/><circle cx="-37" cy="2" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><circle cx="-18" cy="15" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><circle cx="0" cy="-3" r="5" fill="#b95d43" stroke="none" stroke-width="2"/><circle cx="2" cy="-27" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><circle cx="21" cy="-43" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><