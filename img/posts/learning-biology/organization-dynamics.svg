dth="3"/><path d="M146,22 L162,38 L146,54 L130,38 Z" fill="#fff0e8" stroke="#b95d43" stroke-width="3"/></g><path d="M1030,379 L1030,411" fill="none" stroke="#146fa3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-146fa3)"/><text x="1030" y="450" fill="#146fa3" font-size="27" font-weight="400" text-anchor="middle"><tspan x="1030" dy="0">Responses can propagate</tspan><tspan x="1030" dy="35.1">between groups</tspan></text><circle cx="77" cy="578" r="11" fill="#e4f0f1" stroke="#087f8c" stroke-width="3"/><path d="M114,565 L127,578 L114,591 L101,578 Z" fill="#fff0e8" stroke="#b95d43" stroke-width="3"/><text x="143" y="586" fill="#506677" font-size="24" font-weight="400" text-anchor="start"><tspan x="143" dy="0">3 of each component type; only the connections change</tspan></text><text x="60" y="626" fill="#506677" font-size="26" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Collective dynamics also depend on interaction strengths, timing, and context.</tspan></text><rect x="60" y="671" width="1280" height="381" rx="22" fill="white" stroke="#d7e2e8" stroke-width="2"/><text x="90" y="719" fill="#087f8c" font-size="24" font-weight="700" text-anchor="start"><tspan x="90" dy="0">CROSS-SCALE RELATIONS ARE PART OF THE MODEL</tspan></text><g transform="translate(245 853) scale(1.2)"><path d="M-55,19 L-37,2 L-18,15 L0,-3 L2,-27 L21,-43 L43,-30 L44,-8 L24,9 L32,31 L53,41" fill="none" stroke="#087f8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-55" cy="19" r="5" fill="#b95d43" stroke="none" stroke-width="2"/><circle cx="-37" cy="2" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><circle cx="-18" cy="15" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><circle cx="0" cy="-3" r="5" fill="#b95d43" stroke="none" stroke-width="2"/><circle cx="2" cy="-27" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><circle cx="21" cy="-43" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><circle cx="43" cy="-30" r="5" fill="#b95d43" stroke="none" stroke-width="2"/><circle cx="44" cy="-8" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><circle cx="24" cy="9" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><circle cx="32" cy="31" r="5" fill="#b95d43" stroke="none" stroke-width="2"/><circle cx="53" cy="41" r="5" fill="#087f8c" stroke="none" stroke-width="2"/></g><text x="245" y="961" fill="#183448" font-size="28" font-weight="700" text-anchor="middle"><tspan x="245" dy="0">Molecular interactions</tspan></text><text x="245" y="1002" fill="#506677" font-size="24" font-weight="400" text-anchor="middle"><tspan x="245" dy="0">Binding and regulation</tspan></text><g transform="translate(700 853) scale(1.2)"><path d="M-60,-24 C-41,-61 30,-59 57,-22 C82,14 44,60 -4,53 C-47,55 -79,10 -60,-24 Z" fill="#eaf3f5" stroke="#146fa3" stroke-width="3"/><circle cx="-4" cy="0" r="18" fill="#d1e5ea" stroke="#146fa3" stroke-width="2"/><path d="M-4,0 L-35,-17" fill="none" stroke="#087f8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-35" cy="-17" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><path d="M-4,0 L25,-26" fill="none" stroke="#087f8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="25" cy="-26" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><path d="M-4,0 L37,10" fill="none" stroke="#087f8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="37" cy="10" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><path d="M-4,0 L11,32" fill="none" stroke="#087f8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="32" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><path d="M-4,0 L-34,26" fill="none" stroke="#087f8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-34" cy="26" r="5" fill="#087f8c" stroke="none" stroke-width="2"/></g><text x="700" y="961" fill="#183448" font-size="28" font-weight="700" text-anchor="middle"><tspan x="700" dy="0">Cellular state</tspan></text><text x="700" y="1002" fill="#506677" font-size="24" font-weight="400" text-anchor="middle"><tspan x="700" dy="0">Programs and responses</tspan></text><g transform="translate(1155 853) scale(1.2)"><path d="M-60,-46 L-42,-55 L-24,-46 L-24,-25 L-42,-16 L-60,-25 Z" fill="#eaf0f8" stroke="#146fa3" stroke-width="2"/><circle cx="-42" cy="-36" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><path d="M-22,-46 L-4,-55 L14,-46 L14,-25 L-4,-16 L-22,-25 Z" fill="#e7f2f1" stroke="#146fa3" stroke-width="2"/><circle cx="-4" cy="-36" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><path d="M16,-46 L34,-55 L52,-46 L52,-25 L34,-16 L16,-25 Z" fill="#eaf0f8" stroke="#146fa3" stroke-width="2"/><circle cx="34" cy="-36" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><path d="M-52,-11 L-34,-20 L-16,-11 L-16,10 L-34,19 L-52,10 Z" fill="#e7f2f1" stroke="#146fa3" stroke-width="2"/><circle cx="-34" cy="-1" r="5" fill="#b95d43" stroke="none" stroke-width="2"/><path d="M-14,-11 L4,-20 L22,-11 L22,10 L4,19 L-14,10 Z" fill="#eaf0f8" stroke="#146fa3" stroke-width="2"/><circle cx="4" cy="-1" r="5" fill="#b95d43" stroke="none" stroke-width="2"/><path d="M24,-11 L42,-20 L60,-11 L60,10 L42,19 L24,10 Z" fill="#e7f2f1" stroke="#146fa3" stroke-width="2"/><circle cx="42" cy="-1" r="5" fill="#b95d43" stroke="none" stroke-width="2"/><path d="M-60,24 L-42,15 L-24,24 L-24,45 L-42,54 L-60,45 Z" fill="#eaf0f8" stroke="#146fa3" stroke-width="2"/><circle cx="-42" cy="34" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><path d="M-22,24 L-4,15 L14,24 L14,45 L-4,54 L-22,45 Z" fill="#e7f2f1" stroke="#146fa3" stroke-width="2"/><circle cx="-4" cy="34" r="5" fill="#087f8c" stroke="none" stroke-width="2"/><path d="M16,24 L34,15 L52,24 L52,45 L34,54 L16,45 Z" fill="#eaf0f8" stroke="#146fa3" stroke-width="2"/><circle cx="34" cy="34" r="5" fill="#087f8c" stroke="none" stroke-width="2"/></g><text x="1155" y="961" fill="#183448" font-size="28" font-weight="700" text-anchor="middle"><tspan x="1155" dy="0">Tissue organization</tspan></text><text x="1155" y="1002" fill="#506677" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1155" dy="0">Neighbors and geometry</tspan></text><path d="M343,805 L598,805" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-087f8c)"/><text x="470.5" y="784" fill="#087f8c" font-size="24" font-weight="400" text-anchor="middle"><tspan x="470.5" dy="0">Joint effects</tspan></text><path d="M598,888 L343,888" fill="none" stroke="#b95d43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b95d43)"/><text x="470.5" y="925" fill="#b95d43" font-size="23" font-weight="400" text-anchor="middle"><tspan x="470.5" dy="0">Local conditions</tspan></text><path d="M800,805 L1047,805" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-087f8c)"/><text x="923.5" y="784" fill="#087f8c" font-size="24" font-weight="400" text-anchor="middle"><tspan x="923.5" dy="0">Coordination</tspan></text><path d="M1047,888 L800,888" fill="none" stroke="#b95d43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-b95d43)"/><text x="923.5" y="925" fill="#b95d43" font-size="23" font-weight="400" text-anchor="middle"><tspan x="923.5" dy="0">Signals + geometry</tspan></text><text x="60" y="1100" fill="#506677" font-size="23" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Conceptual example; no measured data</tspan></text></g></svg>