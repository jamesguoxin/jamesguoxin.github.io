<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1140" viewBox="0 0 1400 1140" role="img" aria-labelledby="title desc">
<title id="title">Organization and dynamics across biological scales</title><desc id="desc">Two networks contain the same three teal circles and three coral diamonds. Added connections allow propagation between groups. Molecular, cellular and tissue scales exchange influences and context; the graph is conceptual.</desc>
<defs><marker id="arrow-183448" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#183448" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-087f8c" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#087f8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-146fa3" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#146fa3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-b95d43" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#b95d43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-506677" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,2 L10,6 L2,10" fill="none" stroke="#506677" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1400" height="1140" rx="24" fill="#fafaf6"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="60" y="74" fill="#183448" font-size="40" font-weight="700" text-anchor="start"><tspan x="60" dy="0">Organization changes what a system can do</tspan></text><text x="60" y="122" fill="#506677" font-size="27" font-weight="400" text-anchor="start"><tspan x="60" dy="0">The same parts can participate in different patterns of interaction.</tspan></text><rect x="60" y="170" width="620" height="370" rx="22" fill="white" stroke="#d7e2e8" stroke-width="2"/><text x="90" y="218" fill="#183448" font-size="29" font-weight="700" text-anchor="start"><tspan x="90" dy="0">Separated groups</tspan></text><g transform="translate(370 309) scale(1.35)"><path d="M-106,-37 L-146,38" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-146,38 L-65,38" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-65,38 L-106,-37" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M106,-37 L65,38" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M65,38 L146,38" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M146,38 L106,-37" fill="none" stroke="#087f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-106" cy="-37" r="14" fill="#e4f0f1" stroke="#087f8c" stroke-width="3"/><path d="M-146,22 L-130,38 L-146,54 L-162,38 Z" fill="#fff0e8" stroke="#b95d43" stroke-width="3"/><circle cx="-65" cy="38" r="14" fill="#e4f0f1" stroke="#087f8c" stroke-width="3"/><path d="M106,-53 L122,-37 L106,-21 L90,-37 Z" fill="#fff0e8" stroke="#b95d43" stroke-width="3"/><circle cx="65" cy="38" r="14" fill="#e4f0f1" stroke="#087f8c" stroke-width="3"/><path d="M146,22 L162,38 L146,54 L130,38 Z" fill="#fff0e8" stroke="#b95d43" stroke-width="3"/></g><path d="M370,379 L370,411" fill="none" s