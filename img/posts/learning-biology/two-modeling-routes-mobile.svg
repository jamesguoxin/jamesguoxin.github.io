<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2072" viewBox="0 0 640 2072" role="img" aria-labelledby="title desc">
<title id="title">Two published perspectives on biological AI</title><desc id="desc">Comparison of two published 2026 perspectives. Stelzer and Tanay emphasize canonical process observations, coordinates in space and time, and perturbation evidence. Song, Segal and Xing propose specialized foundation models, connections between models, and alignment across scales. The shared question is how to represent biological organization across scales.</desc>
